<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AtDownloader</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#fff; --bg2:#f4f5f7; --ink:#172b4d; --ink2:#5e6c84; --linha:#dfe1e6;
  --azul:#0079bf; --azul2:#005a8c; --verde:#61bd4f; --amarelo:#f2d600; --vermelho:#eb5a46;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d2125; --bg2:#22272b; --ink:#b6c2cf; --ink2:#8c9bab; --linha:#2c333a;
         --azul:#579dff; --azul2:#85b8ff; --vermelho:#f87168; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; width:460px; height:560px; background:var(--bg); color:var(--ink);
  display:flex; flex-direction:column;
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.topo{padding:12px 14px 9px; border-bottom:1px solid var(--linha); flex:none}
.topo h1{font-size:14px; margin:0 0 2px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topo p{margin:0; font-size:12px; color:var(--ink2)}
.corpo{flex:1; overflow-y:auto; padding:4px 14px}
.rodape{flex:none; padding:11px 14px; border-top:1px solid var(--linha); background:var(--bg2)}
.rodape .linha1{display:flex; gap:10px; align-items:center}
button{font:inherit; font-weight:500; border:0; border-radius:3px; cursor:pointer;
  padding:8px 14px; background:var(--azul); color:#fff}
button:hover:not(:disabled){background:var(--azul2)}
button:disabled{opacity:.5; cursor:default}

.grupo{margin:0}
.grupo .cab{display:flex; align-items:center; gap:8px; padding:0 2px; border-bottom:1px solid var(--linha)}
.grupo .cab input{width:14px; height:14px; accent-color:var(--azul); flex:none; cursor:pointer}
/* o cabeçalho inteiro é um botão: clicar no cartão abre e fecha a lista dele.
   A caixa de marcar fica FORA do botão, senão marcar um cartão o abriria. */
.grupo .cab .expandir{flex:1; min-width:0; display:flex; align-items:center; gap:8px;
  background:none; color:inherit; border:0; padding:8px 2px; font:inherit; text-align:left; cursor:pointer}
.grupo .cab .expandir:hover{background:none}
.grupo .cab .expandir:hover b{color:var(--azul)}
.grupo .cab .seta{flex:none; width:10px; font-size:9px; color:var(--ink2); transition:transform .12s}
.grupo .cab[aberto] .seta{transform:rotate(90deg)}
.grupo .cab b{font-size:12.5px; font-weight:600; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grupo .cab .lista{flex:none; font-size:10.5px; color:var(--ink2); background:var(--bg2);
  border:1px solid var(--linha); border-radius:9px; padding:1px 7px; max-width:130px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grupo .cab .conta{font-size:11px; color:var(--ink2); flex:none}
.discreto{background:none; color:var(--azul); padding:0; font-size:12px; font-weight:400;
  border:0; cursor:pointer; font-family:inherit}
.discreto:hover{background:none; text-decoration:underline}
.grupo .itens{border-bottom:1px solid var(--linha); padding-bottom:2px}
.item{display:flex; align-items:center; gap:9px; padding:7px 2px 7px 22px; border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item input{width:15px; height:15px; accent-color:var(--azul); flex:none; cursor:pointer}
.item .nome{flex:1; min-width:0}
.item .nome b{display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .nome span{font-size:11.5px; color:var(--ink2)}
.item .estado{flex:none; font-size:11.5px; color:var(--ink2); min-width:18px; text-align:right}
.estado.ok{color:var(--verde)}
.estado.erro{color:var(--vermelho)}
.aviso{background:var(--bg2); border:1px solid var(--linha); border-left:3px solid var(--amarelo);
  border-radius:3px; padding:10px 12px; margin:11px 0; font-size:12.5px; line-height:1.5}
.aviso.ruim{border-left-color:var(--vermelho)}
.aviso ul{margin:6px 0 0; padding-left:19px}
.centro{text-align:center; padding:30px 18px; color:var(--ink2)}
.centro b{display:block; color:var(--ink); font-size:14px; margin-bottom:5px}
.marcar{font-size:12px; color:var(--ink2); padding:7px 2px; display:flex; gap:11px}
.marcar button{background:none; color:var(--azul); padding:0; font-size:12px; font-weight:400;
  border:0; cursor:pointer; font-family:inherit}
.marcar button:hover{background:none; text-decoration:underline}
.ok{color:var(--verde)} .erro{color:var(--vermelho)}
code{background:var(--bg2); padding:1px 4px; border-radius:3px; font-size:11.5px}
</style>
</head>
<body>

<div class="topo">
  <h1 id="titulo">Carregando…</h1>
  <p id="sub"></p>
</div>

<div class="corpo" id="corpo">
  <div class="centro">Lendo os anexos do board…</div>
</div>

<div class="rodape" id="rodape" hidden>
  <div class="linha1">
    <button id="baixar">Baixar</button>
    <span id="progresso" style="font-size:12px;color:var(--ink2);flex:1"></span>
  </div>
  <div style="margin-top:7px">
    <button class="discreto" id="porZip">Baixar tudo num .zip</button>
  </div>
</div>

<script src="zip.js"></script>
<script src="popup.js"></script>
</body>
</html>
