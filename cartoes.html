<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtDownloader — board</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#fff; --bg2:#f4f5f7; --ink:#172b4d; --ink2:#5e6c84; --linha:#dfe1e6;
  --azul:#0079bf; --azul2:#005a8c; --verde:#61bd4f; --amarelo:#f2d600;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d2125; --bg2:#22272b; --ink:#b6c2cf; --ink2:#8c9bab; --linha:#2c333a;
         --azul:#579dff; --azul2:#85b8ff; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.topo{padding:14px 16px 10px; border-bottom:1px solid var(--linha); flex:none}
.topo h1{font-size:15px; margin:0 0 3px; font-weight:600}
.topo p{margin:0; font-size:12.5px; color:var(--ink2)}
.corpo{flex:1; overflow-y:auto; padding:6px 16px}
.rodape{flex:none; padding:12px 16px; border-top:1px solid var(--linha); background:var(--bg2)}
.rodape .linha1{display:flex; gap:10px; align-items:center}
button{font:inherit; font-weight:500; border:0; border-radius:3px; cursor:pointer;
  padding:9px 16px; background:var(--azul); color:#fff}
button:hover:not(:disabled){background:var(--azul2)}
button:disabled{opacity:.5; cursor:default}

.grupo{margin:14px 0 0}
.grupo .cab{display:flex; align-items:center; gap:9px; padding:6px 2px 7px; border-bottom:1px solid var(--linha)}
.grupo .cab input{width:15px; height:15px; accent-color:var(--azul); flex:none; cursor:pointer}
.grupo .cab b{font-size:13px; font-weight:600; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grupo .cab span{font-size:11.5px; color:var(--ink2); flex:none}
.item{display:flex; align-items:center; gap:10px; padding:8px 2px 8px 24px; border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item input{width:16px; height:16px; accent-color:var(--azul); flex:none; cursor:pointer}
.item .nome{flex:1; min-width:0}
.item .nome b{display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .nome span{font-size:12px; color:var(--ink2)}
.item .estado{flex:none; font-size:12px; color:var(--verde); min-width:20px; text-align:right}
.aviso{background:var(--bg2); border:1px solid var(--linha); border-left:3px solid var(--amarelo);
  border-radius:3px; padding:11px 13px; margin:12px 0; font-size:13px; line-height:1.5}
.centro{text-align:center; padding:34px 20px; color:var(--ink2)}
.centro b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}
.marcar{font-size:12.5px; color:var(--ink2); padding:8px 2px; display:flex; gap:12px}
.marcar button, .discreto{background:none; color:var(--azul); padding:0; font-size:12.5px; font-weight:400;
  border:0; cursor:pointer; font-family:inherit}
.marcar button:hover, .discreto:hover{background:none; text-decoration:underline}
a{color:var(--azul)}
</style>
</head>
<body>

<div class="topo">
  <h1 id="titulo">Carregando…</h1>
  <p id="sub"></p>
</div>

<div class="corpo" id="corpo">
  <div class="centro">Procurando anexos no board…</div>
</div>

<div class="rodape" id="rodape" hidden>
  <div class="linha1">
    <button id="baixar">Baixar</button>
    <span id="progresso" style="font-size:12.5px;color:var(--ink2);flex:1"></span>
  </div>
  <div style="margin-top:8px">
    <button class="discreto" id="porAbas">Prefere abrir em abas?</button>
  </div>
</div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="js/config.js"></script>
<script>
"use strict";

/* Sem token e sem API REST: t.cards() entrega os cartões do board com
   os anexos, e quem baixa é o navegador, pela sua sessão do Trello. */

const t = window.TrelloPowerUp.iframe({ appKey: TRELLO_APP_KEY, appName: APP_NOME });
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let board = null, grupos = [], itens = [];

const kb = n => {
  if (n == null || !isFinite(n)) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(0) + " KB";
  return (n/1048576).toFixed(1).replace(".", ",") + " MB";
};
const escapar = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ehArquivo(a){
  if (typeof a.bytes === "number" && a.bytes > 0) return true;
  return /\/attachments\/[a-f0-9]{24}\/download\//i.test(a.url || "");
}
const comLimite = (p, ms) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error("SEM_CONTEXTO")), ms))
]);
function telaCentro(html){ $("#corpo").innerHTML = `<div class="centro">${html}</div>`; }

function baixarEmbutido(urls){
  urls.forEach((u, i) => setTimeout(() => {
    const f = document.createElement("iframe");
    f.style.display = "none"; f.src = u;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 60000);
  }, i * 400));
}
function baixarPorAbas(urls){
  urls.forEach((u, i) => setTimeout(() => window.open(u, "_blank", "noopener"), i * 350));
}

function disparar(modo){
  const alvos = itens.filter(i => i.marcado);
  if (!alvos.length) return;
  const arquivos = alvos.filter(i => i.arquivo);
  const links = alvos.filter(i => !i.arquivo);
  (modo === "abas" ? baixarPorAbas : baixarEmbutido)(arquivos.map(i => i.url));
  // Link não é arquivo: num iframe escondido ele só carregaria a página
  // e nada chegaria ao usuário. Link sempre abre em aba.
  if (links.length) baixarPorAbas(links.map(i => i.url));
  alvos.forEach(i => { const el = $("#e" + i.idx); if (el) el.textContent = "✓"; });
  $("#progresso").textContent =
    `${alvos.length} anexo${alvos.length===1?"":"s"} enviado${alvos.length===1?"":"s"} para o navegador`;
}

/* ---------- tela ---------- */
function telaLista(){
  const arquivos = itens.filter(i => i.arquivo);
  const total = arquivos.reduce((s,i) => s + (i.bytes||0), 0);

  $("#titulo").textContent = board.name || "Board";
  $("#sub").textContent = `${grupos.length} cartão${grupos.length===1?"":"es"} com anexo · `
    + `${arquivos.length} arquivo${arquivos.length===1?"":"s"}` + (total ? ` · ${kb(total)}` : "");

  let html = `<div class="aviso">Os arquivos são baixados pelo próprio navegador, um a um,
    direto para a sua pasta de Downloads. Na primeira vez o navegador pergunta se pode
    <b>baixar vários arquivos</b> — é normal, é só permitir.</div>`;

  html += `<div class="marcar">
      <button onclick="marcarTodos(true)">Marcar todos</button>
      <button onclick="marcarTodos(false)">Desmarcar todos</button>
    </div>`;

  html += grupos.map((g, gi) => `
    <div class="grupo">
      <label class="cab">
        <input type="checkbox" data-g="${gi}" checked>
        <b>${escapar(g.nome)}</b>
        <span>${g.itens.length} anexo${g.itens.length===1?"":"s"}</span>
      </label>
      ${g.itens.map(i => `
        <label class="item">
          <input type="checkbox" data-i="${i.idx}" ${i.marcado?"checked":""}>
          <span class="nome">
            <b>${escapar(i.nome)}</b>
            <span>${i.arquivo ? kb(i.bytes) : "link — abre numa aba"}</span>
          </span>
          <span class="estado" id="e${i.idx}"></span>
        </label>`).join("")}
    </div>`).join("");

  $("#corpo").innerHTML = html;
  $("#rodape").hidden = false;

  $("#corpo").addEventListener("change", e => {
    const cb = e.target.closest("input[type=checkbox]");
    if (!cb) return;
    if (cb.dataset.g !== undefined) {
      // marcar o cartão inteiro marca todos os anexos dele
      const g = grupos[+cb.dataset.g];
      g.itens.forEach(i => {
        i.marcado = cb.checked;
        const el = $(`#corpo input[data-i="${i.idx}"]`);
        if (el) el.checked = cb.checked;
      });
    } else {
      itens[+cb.dataset.i].marcado = cb.checked;
      sincronizarCabecalhos();
    }
    atualizarBotao();
  });
  atualizarBotao();
}

function sincronizarCabecalhos(){
  grupos.forEach((g, gi) => {
    const cb = $(`#corpo input[data-g="${gi}"]`);
    if (!cb) return;
    const marcados = g.itens.filter(i => i.marcado).length;
    cb.checked = marcados === g.itens.length;
    cb.indeterminate = marcados > 0 && marcados < g.itens.length;
  });
}

window.marcarTodos = v => {
  itens.forEach(i => i.marcado = v);
  $$("#corpo input[type=checkbox]").forEach(c => { c.checked = v; c.indeterminate = false; });
  atualizarBotao();
};

function atualizarBotao(){
  const n = itens.filter(i => i.marcado).length;
  $("#baixar").disabled = n === 0;
  $("#baixar").textContent = n === 0 ? "Baixar" : `Baixar ${n} anexo${n===1?"":"s"}`;
  $("#porAbas").hidden = n === 0;
}

$("#baixar").onclick = () => disparar("embutido");
$("#porAbas").onclick = () => disparar("abas");

/* ---------- carregar ---------- */
async function carregar(){
  let cards;
  try {
    board = await comLimite(t.board("id", "name"), 8000);
    cards = await comLimite(t.cards("id", "name", "attachments"), 12000);
  } catch (e) {
    $("#titulo").textContent = "Abra pelo Trello";
    return telaCentro(`<b>Esta página só funciona dentro de um board.</b>
      Ela não guarda dado nenhum por conta própria: quem entrega as informações é o
      Trello, e só quando ela é aberta pelo botão <b>AtDownloader</b> no board.`);
  }

  let idx = 0;
  grupos = (cards || []).map(c => {
    const lista = (c.attachments || []).map(a => ({
      idx: idx++,
      nome: a.fileName || a.name || "arquivo",
      bytes: a.bytes, url: a.url,
      arquivo: ehArquivo(a), marcado: true
    }));
    return { nome: c.name, itens: lista };
  }).filter(g => g.itens.length);

  itens = grupos.flatMap(g => g.itens);

  if (!itens.length) {
    $("#titulo").textContent = board.name || "Board";
    return telaCentro("<b>Nenhum cartão deste board tem anexos.</b>Nada para baixar aqui.");
  }
  telaLista();
}

carregar().catch(e => {
  console.error(e);
  telaCentro(`<b>Algo deu errado.</b> ${escapar(e && e.message || "")}`);
});
</script>
</body>
</html>
