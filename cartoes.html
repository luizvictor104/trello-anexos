<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AtDownloader — board</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#fff; --bg2:#f4f5f7; --ink:#172b4d; --ink2:#5e6c84; --linha:#dfe1e6;
  --azul:#0079bf; --azul2:#005a8c; --verde:#61bd4f; --amarelo:#f2d600; --vermelho:#eb5a46;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d2125; --bg2:#22272b; --ink:#b6c2cf; --ink2:#8c9bab; --linha:#2c333a;
         --azul:#579dff; --azul2:#85b8ff; --vermelho:#f87168; }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.topo{padding:14px 16px 10px; border-bottom:1px solid var(--linha); flex:none}
.topo h1{font-size:15px; margin:0 0 3px; font-weight:600}
.topo p{margin:0; font-size:12.5px; color:var(--ink2)}
.corpo{flex:1; overflow-y:auto; padding:6px 16px}
.rodape{flex:none; padding:12px 16px; border-top:1px solid var(--linha); background:var(--bg2)}
.rodape .linha1{display:flex; gap:10px; align-items:center}
button{font:inherit; font-weight:500; border:0; border-radius:3px; cursor:pointer;
  padding:9px 16px; background:var(--azul); color:#fff}
button:hover:not(:disabled){background:var(--azul2)}
button:disabled{opacity:.5; cursor:default}

.grupo{margin:14px 0 0}
.grupo .cab{display:flex; align-items:center; gap:9px; padding:6px 2px 7px; border-bottom:1px solid var(--linha)}
.grupo .cab input{width:15px; height:15px; accent-color:var(--azul); flex:none; cursor:pointer}
.grupo .cab b{font-size:13px; font-weight:600; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.grupo .cab span{font-size:11.5px; color:var(--ink2); flex:none}
.item{display:flex; align-items:center; gap:10px; padding:8px 2px 8px 24px; border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item input{width:16px; height:16px; accent-color:var(--azul); flex:none; cursor:pointer}
.item .nome{flex:1; min-width:0}
.item .nome b{display:block; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.item .nome span{font-size:12px; color:var(--ink2)}
.item .estado{flex:none; font-size:12px; color:var(--ink2); min-width:20px; text-align:right}
.estado.ok{color:var(--verde)}
.estado.erro{color:var(--vermelho)}
.aviso{background:var(--bg2); border:1px solid var(--linha); border-left:3px solid var(--amarelo);
  border-radius:3px; padding:11px 13px; margin:12px 0; font-size:13px; line-height:1.5}
.aviso.ruim{border-left-color:var(--vermelho)}
.aviso ul{margin:7px 0 0; padding-left:20px}
.centro{text-align:center; padding:34px 20px; color:var(--ink2)}
.centro b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}
.marcar{font-size:12.5px; color:var(--ink2); padding:8px 2px; display:flex; gap:12px}
.marcar button, .discreto{background:none; color:var(--azul); padding:0; font-size:12.5px; font-weight:400;
  border:0; cursor:pointer; font-family:inherit}
.marcar button:hover, .discreto:hover{background:none; text-decoration:underline}
.ok{color:var(--verde)} .erro{color:var(--vermelho)}
a{color:var(--azul)}
</style>
</head>
<body>

<div class="topo">
  <h1 id="titulo">Carregando…</h1>
  <p id="sub"></p>
</div>

<div class="corpo" id="corpo">
  <div class="centro">Procurando anexos no board…</div>
</div>

<div class="rodape" id="rodape" hidden>
  <div class="linha1">
    <button id="baixar">Baixar</button>
    <span id="progresso" style="font-size:12.5px;color:var(--ink2);flex:1"></span>
  </div>
  <div style="margin-top:8px; display:flex; gap:14px; flex-wrap:wrap">
    <button class="discreto" id="porAbas">Abrir em abas</button>
    <button class="discreto" id="porZip" title="Precisa de um proxy: o Trello não deixa o navegador ler os bytes de outra origem">Baixar em .zip (ainda não funciona)</button>
  </div>
</div>

<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="js/config.js"></script>
<script src="js/zip.js"></script>
<script>
"use strict";

/* A lista de cartões vem de t.cards(), que não precisa de token. Já os BYTES
   de cada anexo precisam: a URL de download do Trello não aceita o cookie de
   sessão de outra origem, então vai por Authorization: OAuth.

   Por que não dá para deixar o navegador baixar sozinho (era o desenho antigo):
   a URL de download não manda mais Content-Disposition: attachment. Apontar um
   iframe ou uma aba para ela só EXIBE o arquivo — nada é salvo. Por isso os
   bytes são buscados aqui e viram um zip montado no cliente. */

const t = window.TrelloPowerUp.iframe({ appKey: TRELLO_APP_KEY, appName: APP_NOME });
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let board = null, grupos = [], itens = [], token = null;

const kb = n => {
  if (n == null || !isFinite(n)) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(0) + " KB";
  return (n/1048576).toFixed(1).replace(".", ",") + " MB";
};
const escapar = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ehArquivo(a){
  if (typeof a.bytes === "number" && a.bytes > 0) return true;
  return /\/attachments\/[a-f0-9]{24}\/download\//i.test(a.url || "");
}

/* O Trello só manda Content-Disposition: attachment no que o navegador NÃO
   sabe exibir. Medido em 03/08/2026: pdf vem como attachment; png, jpeg, mp4,
   quicktime e mpeg vêm sem o cabeçalho, e o navegador exibe em vez de salvar.
   Como não dá para ler o cabeçalho de outra origem (o mesmo CORS que barra o
   zip), isto é deduzido do tipo — por isso a tela fala em "abre para ver",
   e não promete que salvou. */
function ehExibivel(a){
  const mt = String(a.mimeType || "").toLowerCase();
  if (mt) return /^(image|video|audio)\//.test(mt);
  const nome = String(a.fileName || a.name || "");
  return /\.(png|jpe?g|gif|webp|avif|bmp|ico|svg|mp4|mov|m4v|webm|ogv|mp3|wav|ogg|m4a|aac|flac)$/i.test(nome);
}

const cabecalhoAuth = () =>
  ({ Authorization: `OAuth oauth_consumer_key="${TRELLO_APP_KEY}", oauth_token="${token}"` });

/* api.trello.com é o host da API; trello.com serve o mesmo arquivo, mas os
   dois só respondem ao preflight de CORS no caminho /1/. */
const urlApi = u => String(u || "").replace(/^https:\/\/trello\.com\/1\//, "https://api.trello.com/1/");

/* TypeError sem status = o navegador barrou (CORS). HTTP com status = o
   Trello respondeu e recusou. As duas coisas pedem soluções opostas. */
function descreverErro(e){
  if (e && e.status) return `HTTP ${e.status}`;
  if (e instanceof TypeError) return "bloqueado pelo navegador (CORS)";
  return (e && e.message) || "desconhecido";
}

const comLimite = (p, ms) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error("SEM_CONTEXTO")), ms))
]);
function telaCentro(html){ $("#corpo").innerHTML = `<div class="centro">${html}</div>`; }

/* ---------- tela ---------- */
function telaLista(){
  const arquivos = itens.filter(i => i.arquivo);
  const total = arquivos.reduce((s,i) => s + (i.bytes||0), 0);

  $("#titulo").textContent = board.name || "Board";
  $("#sub").textContent = `${grupos.length} cartão${grupos.length===1?"":"es"} com anexo · `
    + `${arquivos.length} arquivo${arquivos.length===1?"":"s"}` + (total ? ` · ${kb(total)}` : "");

  const exibiveis = arquivos.filter(i => i.exibivel).length;

  let html = "";
  if (exibiveis) {
    html += `<div class="aviso"><b>${exibiveis} de ${arquivos.length} arquivo${arquivos.length===1?"":"s"}
      o navegador não salva sozinho.</b> O Trello entrega imagem, vídeo e áudio para
      <b>exibir</b>, não para baixar — eles abrem numa aba e você salva com ⌘S.
      O resto (pdf, zip, doc…) cai direto na pasta de Downloads.</div>`;
  }

  html += `<div class="marcar">
      <button onclick="marcarTodos(true)">Marcar todos</button>
      <button onclick="marcarTodos(false)">Desmarcar todos</button>
    </div>`;

  html += grupos.map((g, gi) => `
    <div class="grupo">
      <label class="cab">
        <input type="checkbox" data-g="${gi}" checked>
        <b>${escapar(g.nome)}</b>
        <span>${g.itens.length} anexo${g.itens.length===1?"":"s"}</span>
      </label>
      ${g.itens.map(i => `
        <label class="item">
          <input type="checkbox" data-i="${i.idx}" ${i.marcado?"checked":""}>
          <span class="nome">
            <b>${escapar(i.nome)}</b>
            <span>${!i.arquivo ? "link — abre numa aba"
              : kb(i.bytes) + (i.exibivel ? " · abre para ver" : " · salva direto")}</span>
          </span>
          <span class="estado" id="e${i.idx}"></span>
        </label>`).join("")}
    </div>`).join("");

  $("#corpo").innerHTML = html;
  $("#rodape").hidden = false;

  $("#corpo").addEventListener("change", e => {
    const cb = e.target.closest("input[type=checkbox]");
    if (!cb) return;
    if (cb.dataset.g !== undefined) {
      // marcar o cartão inteiro marca todos os anexos dele
      const g = grupos[+cb.dataset.g];
      g.itens.forEach(i => {
        i.marcado = cb.checked;
        const el = $(`#corpo input[data-i="${i.idx}"]`);
        if (el) el.checked = cb.checked;
      });
    } else {
      itens[+cb.dataset.i].marcado = cb.checked;
      sincronizarCabecalhos();
    }
    atualizarBotao();
  });
  atualizarBotao();
}

function sincronizarCabecalhos(){
  grupos.forEach((g, gi) => {
    const cb = $(`#corpo input[data-g="${gi}"]`);
    if (!cb) return;
    const marcados = g.itens.filter(i => i.marcado).length;
    cb.checked = marcados === g.itens.length;
    cb.indeterminate = marcados > 0 && marcados < g.itens.length;
  });
}

window.marcarTodos = v => {
  itens.forEach(i => i.marcado = v);
  $$("#corpo input[type=checkbox]").forEach(c => { c.checked = v; c.indeterminate = false; });
  atualizarBotao();
};

function atualizarBotao(){
  const n = itens.filter(i => i.marcado).length;
  $("#baixar").disabled = n === 0;
  $("#baixar").textContent = n === 0 ? "Baixar" : `Baixar ${n} anexo${n===1?"":"s"}`;
  $("#porAbas").hidden = n === 0;
  $("#porZip").hidden = n === 0;
}

/* ---------- baixar ---------- */
function abrirEmAbas(urls){
  urls.forEach((u, i) => setTimeout(() => window.open(u, "_blank", "noopener"), i * 350));
}

/* iframe escondido: para quem vem com Content-Disposition: attachment, o
   navegador salva sem abrir aba e sem esbarrar no bloqueador de pop-up.
   Para imagem/vídeo/áudio isto não serve — o arquivo seria só renderizado
   dentro do iframe invisível, que é exatamente o bug de 819ea1b. */
function baixarEmbutido(urls){
  urls.forEach((u, i) => setTimeout(() => {
    const f = document.createElement("iframe");
    f.style.display = "none"; f.src = u;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 60000);
  }, i * 400));
}

function baixarDireto(){
  const alvos = itens.filter(i => i.marcado);
  if (!alvos.length) return;

  const salvam  = alvos.filter(i => i.arquivo && !i.exibivel);
  const abrem   = alvos.filter(i => !i.arquivo || i.exibivel);

  baixarEmbutido(salvam.map(i => i.url));
  salvam.forEach(i => { const el = $("#e" + i.idx);
    if (el) { el.textContent = "↓"; el.className = "estado ok"; } });
  abrem.forEach(i => { const el = $("#e" + i.idx);
    if (el) { el.textContent = "abre"; el.className = "estado"; } });

  const partes = [];
  if (salvam.length) partes.push(`${salvam.length} enviado${salvam.length===1?"":"s"} para a pasta de Downloads`);
  if (abrem.length)  partes.push(`<span class="erro">${abrem.length} o navegador não salva</span>`);
  $("#progresso").innerHTML = partes.join(" · ");

  const antigo = $("#planoB-box"); if (antigo) antigo.remove();
  if (abrem.length) {
    const box = document.createElement("div");
    box.id = "planoB-box"; box.className = "aviso";
    box.innerHTML = `<b>${abrem.length} anexo${abrem.length===1?"":"s"} o Trello entrega para exibir.</b>
      Abrindo em abas dá para salvar cada um com ⌘S.
      <div style="margin-top:9px"><button id="planoB-btn">Abrir ${abrem.length} em abas</button></div>`;
    $("#corpo").prepend(box);
    $("#planoB-btn").onclick = () => abrirEmAbas(abrem.map(i => i.url));
  }
}

/* O token só faz falta aqui: t.cards() monta a lista sem ele, e o download
   direto vai pelo cookie de sessão do próprio navegador. */
async function garantirToken(){
  if (token) return true;
  const api = t.getRestApi();
  if (!(await comLimite(api.isAuthorized(), 8000))) {
    await api.authorize({ scope: "read", expiration: "never" });
  }
  token = await api.getToken();
  return !!token;
}

async function baixarZip(){
  const alvos = itens.filter(i => i.marcado);
  if (!alvos.length) return;

  try { await garantirToken(); }
  catch (e) {
    $("#progresso").innerHTML = `<span class="erro">Sem autorização: ${escapar(descreverErro(e))}</span>`;
    return;
  }

  $("#baixar").disabled = true;
  $$("#corpo input").forEach(c => c.disabled = true);
  ["#planoB-box","#diag-box"].forEach(s => { const el = $(s); if (el) el.remove(); });
  itens.forEach(i => { i.falhou = false; i.erro = null;
    const el = $("#e" + i.idx); if (el) { el.textContent = ""; el.className = "estado"; } });

  const prontos = [];
  const arquivos = alvos.filter(i => i.arquivo);
  let falhas = 0, feitos = 0;

  for (const i of arquivos) {
    const est = $("#e" + i.idx);
    if (est) { est.textContent = "…"; est.className = "estado"; }
    try {
      const r = await fetch(urlApi(i.url), { headers: cabecalhoAuth() });
      if (!r.ok) { const err = new Error("HTTP " + r.status); err.status = r.status; throw err; }
      prontos.push({ nome: i.nome, dados: new Uint8Array(await r.arrayBuffer()),
                     data: i.data, pasta: i.cartao });
      if (est) { est.textContent = "✓"; est.className = "estado ok"; }
    } catch (e) {
      falhas++; i.falhou = true; i.erro = descreverErro(e);
      if (est) { est.textContent = i.erro; est.className = "estado erro"; }
      console.error("anexo", i.cartao, i.nome, e);
    }
    feitos++;
    $("#progresso").textContent = `${feitos} de ${arquivos.length} arquivos`;
  }

  // links não têm bytes para zipar: viram um txt por cartão
  const links = alvos.filter(i => !i.arquivo);
  const porCartao = {};
  links.forEach(i => { (porCartao[i.cartao] = porCartao[i.cartao] || []).push(`${i.nome}\n${i.url}\n`); });
  Object.entries(porCartao).forEach(([cartao, ls]) => {
    prontos.push({ nome: "_links.txt", dados: new TextEncoder().encode(ls.join("\n")),
                   data: new Date(), pasta: cartao });
  });
  links.forEach(i => { const el = $("#e" + i.idx); if (el) { el.textContent = "✓"; el.className = "estado ok"; } });

  if (!prontos.length) {
    $("#progresso").innerHTML = `<span class="erro">Nenhum anexo baixou. O zip não foi criado.</span>`;
    mostrarDiagnostico(); mostrarPlanoB(arquivos.filter(i => i.falhou));
    $("#baixar").disabled = false;
    $$("#corpo input").forEach(c => c.disabled = false);
    return;
  }

  const zip = ZipSimples.criarZip(prontos);
  const blob = new Blob([zip], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = ZipSimples.nomeSeguro(board.name || "board") + " — anexos.zip";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 2000);

  $("#progresso").innerHTML = falhas
    ? `<span class="erro">${falhas} falhou(ram)</span> · ${prontos.length} no zip`
    : `<span class="ok">Pronto — ${prontos.length} arquivo${prontos.length===1?"":"s"} no zip</span>`;
  if (falhas) { mostrarDiagnostico(); mostrarPlanoB(arquivos.filter(i => i.falhou)); }

  $("#baixar").disabled = false;
  $("#baixar").textContent = "Baixar de novo";
  $$("#corpo input").forEach(c => c.disabled = false);
}

function mostrarDiagnostico(){
  const ruins = itens.filter(i => i.falhou);
  if (!ruins.length) return;
  const antigo = $("#diag-box"); if (antigo) antigo.remove();
  const contagem = {};
  ruins.forEach(i => { contagem[i.erro] = (contagem[i.erro] || 0) + 1; });
  const causas = Object.entries(contagem)
    .map(([causa, n]) => `<li><b>${escapar(causa)}</b> — ${n} anexo${n===1?"":"s"}</li>`).join("");
  const box = document.createElement("div");
  box.id = "diag-box"; box.className = "aviso ruim";
  box.innerHTML = `<b>Por que falhou:</b><ul>${causas}</ul>`;
  $("#corpo").prepend(box);
}

function mostrarPlanoB(ruins){
  if (!ruins.length) return;
  const antigo = $("#planoB-box"); if (antigo) antigo.remove();
  const box = document.createElement("div");
  box.id = "planoB-box"; box.className = "aviso";
  box.innerHTML = `Dá para abrir os que falharam em abas e salvar à mão
    (o Trello exibe o arquivo; use ⌘S em cada aba).
    <div style="margin-top:9px"><button id="planoB-btn">Abrir ${ruins.length} em abas</button></div>`;
  $("#corpo").prepend(box);
  $("#planoB-btn").onclick = () => abrirEmAbas(ruins.map(i => i.url));
}

$("#baixar").onclick = baixarDireto;
$("#porZip").onclick = baixarZip;
$("#porAbas").onclick = () => abrirEmAbas(itens.filter(i => i.marcado).map(i => i.url));

/* ---------- carregar ---------- */
async function carregar(){
  if (!TRELLO_APP_KEY || TRELLO_APP_KEY === "COLE_SUA_CHAVE_AQUI") {
    $("#titulo").textContent = "Falta configurar a chave";
    return telaCentro(`<b>O arquivo js/config.js ainda está com o texto de exemplo.</b>
      Pegue a chave em <a href="https://trello.com/apps/admin" target="_blank">trello.com/apps/admin</a>.`);
  }

  let cards;
  try {
    board = await comLimite(t.board("id", "name"), 8000);
    cards = await comLimite(t.cards("id", "name", "attachments"), 12000);
  } catch (e) {
    $("#titulo").textContent = "Abra pelo Trello";
    return telaCentro(`<b>Esta página só funciona dentro de um board.</b>
      Ela não guarda dado nenhum por conta própria: quem entrega as informações é o
      Trello, e só quando ela é aberta pelo botão <b>AtDownloader</b> no board.`);
  }

  let idx = 0;
  grupos = (cards || []).map(c => {
    const lista = (c.attachments || []).map(a => ({
      idx: idx++,
      nome: a.fileName || a.name || "arquivo",
      bytes: a.bytes, url: a.url,
      data: a.date ? new Date(a.date) : new Date(),
      cartao: c.name,
      arquivo: ehArquivo(a), exibivel: ehExibivel(a), marcado: true
    }));
    return { nome: c.name, itens: lista };
  }).filter(g => g.itens.length);

  itens = grupos.flatMap(g => g.itens);

  if (!itens.length) {
    $("#titulo").textContent = board.name || "Board";
    return telaCentro("<b>Nenhum cartão deste board tem anexos.</b>Nada para baixar aqui.");
  }
  telaLista();
}

carregar().catch(e => {
  console.error(e);
  telaCentro(`<b>Algo deu errado.</b> ${escapar(e && e.message || "")}`);
});
</script>
</body>
</html>
