<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AtDownloader — conector</title>
<!--
  Esta é a "connector page": o Trello carrega este arquivo num iframe
  escondido e conversa com ele por postMessage. Ela não aparece para
  ninguém — só declara o que o Power-Up sabe fazer.
  É a URL desta página que vai no campo "Iframe connector URL" em
  https://trello.com/power-ups/admin
-->
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="js/config.js"></script>
</head>
<body>
<script>
"use strict";

// O Trello acrescenta ?color=hex ao ícone, então ele precisa ser
// um SVG que use currentColor (é o caso do nosso icone.svg).
const ICONE = window.location.origin + window.location.pathname.replace(/index\.html$/, "") + "icone.svg";

/* O GitHub Pages serve com cache-control: max-age=600, e o Trello guarda
   as janelas do Power-Up por conta própria. Sem isto, uma versão velha
   pode continuar rodando por muito tempo depois do deploy.
   Suba este número sempre que mexer em cartoes.html ou baixar.html. */
const VERSAO = "3";

TrelloPowerUp.initialize({
  // Botão no cabeçalho do board: baixa de vários cartões de uma vez.
  // Fica à vista, diferente do botão de cartão, que a interface nova do
  // Trello esconde atrás do ícone de foguete no rodapé do cartão.
  "board-buttons": function (t) {
    return [{
      icon: { dark: ICONE, light: ICONE },
      text: "AtDownloader",
      callback: function (t) {
        return t.modal({
          url: "./cartoes.html?v=" + VERSAO,
          title: "Baixar anexos do board",
          fullscreen: true,
          accentColor: "#0079BF"
        });
      }
    }];
  },
  "card-buttons": function (t) {
    return [{
      icon: ICONE,
      text: "Baixar anexos",
      condition: "edit",
      callback: function (t) {
        return t.modal({
          url: "./baixar.html?v=" + VERSAO,
          title: "Baixar anexos do cartão",
          height: 540,
          accentColor: "#0079BF"
        });
      }
    }];
  }
}, {
  appKey: TRELLO_APP_KEY,
  appName: APP_NOME
});
</script>
</body>
</html>
